<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#f8fafc"/>
  <text x="24" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="600">Stop-and-wait / sliding window link</text>

  <rect x="60" y="70" width="140" height="70" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Sender</text>
  <text x="130" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">frame = 1000 bits</text>

  <rect x="520" y="70" width="140" height="70" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="590" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Receiver</text>
  <text x="590" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">ACK tiny</text>

  <line x1="200" y1="95" x2="520" y2="95" stroke="#0f172a" stroke-width="3"/>
  <text x="360" y="85" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">R = 1 Mbps</text>
  <text x="360" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">one-way Tp = 20 ms</text>

  <rect x="120" y="180" width="480" height="70" rx="10" fill="#fff" stroke="#64748b"/>
  <text x="140" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Ignore processing delay and ACK transmission time.</text>
  <text x="140" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Window size W is in frames.</text>
</svg>
